services:
  jekyll:
    build:
      context: .
      # Hash of the image inputs (set by the Makefile). `make` compares it with
      # the existing image and only rebuilds when an input really changed.
      labels:
        org.arc42.image-inputs: ${IMAGE_INPUTS_HASH:-unset}
    # Own tag: arc42.de-site has a different Gemfile.lock and must not
    # overwrite this image (and vice versa).
    image: arc42-org-site:latest
    init: true
    environment:
      JEKYLL_ENV: development
      POLLING: "--force_polling"
    volumes:
      - .:/site
      - jekyll_cache:/site/.jekyll-cache
      - sass_cache:/site/.sass-cache
    # 4200 is this site's fixed dev port — the first slot in the arc42 42xx
    # block, so every sibling site can run at the same time (see
    # raw/port-assignment.md in meta.arc42.org). --port is passed to Jekyll as
    # well as mapped: its "Server address:" banner reports the port it was told
    # to bind, so a bare 4200:4000 mapping would leave it announcing 4000.
    ports:
      - '4200:4200'
    # No --incremental: full rebuild on change (~2.5s). Incremental silently
    # leaves stale/relocated output when permalinks or front matter change.
    command: >
      sh -c "bundle exec jekyll serve --host 0.0.0.0 --port 4200 --watch $${POLLING}"

volumes:
  jekyll_cache:
  sass_cache:
