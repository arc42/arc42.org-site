- name: "Ivan Bulyk"
  language: "Українська (Ukrainian)"
  bio: >
    The motivation that has always defined his relationship with people is the desire
    to make their lives better, and it shapes the decisions he makes in life. A
    university education in mathematics and computer science, followed by physical
    rehabilitation and medicine, together with many years of experience in sports and
    later yoga, allowed him to keep doing what he loves: treating and teaching. In
    that light, he says, the reason he took part in the arc42 project speaks for itself.

