name: Refresh downloads
# Keeps the download page in step with the arc42-template releases: runs
# _scripts/sync-downloads.rb (the same script as `make sync-downloads`), which writes
# _data/downloads.yml from manifest.json of the latest release, and commits the change.
# The script refuses to write when the release lists fewer languages or formats than
# the page (a broken manifest must not shrink it); removing one on purpose is a manual
# `ALLOW_FEWER=1 make sync-downloads`.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC, safety net; after refresh-trainings (05:47)
  workflow_dispatch:
  repository_dispatch:
    types: [template-released]   # sent by `make release` in arc42-generator (arc42/arc42-generator#89)
permissions:
  contents: write
concurrency:
  group: refresh-downloads
jobs:
  refresh:
    if: github.repository == 'arc42/arc42.org-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The script uses the Ruby standard library only: no bundle install needed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"   # as in the Dockerfile
      - name: Sync _data/downloads.yml from the latest release
        run: ruby _scripts/sync-downloads.rb
      - name: Commit when the release changed the page data
        run: |
          if git diff --quiet -- _data/downloads.yml; then
            echo "No change"
            exit 0
          fi
          release=$(ruby -ryaml -e 'puts YAML.load_file("_data/downloads.yml")["release"]')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/downloads.yml
          git commit -m "downloads: arc42-template release ${release}"
          git push
