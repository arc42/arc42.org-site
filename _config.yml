# Site configuration. Deliberately minimal: Jekyll 4 defaults (kramdown/GFM,
# rouge, utf-8, .sass-cache/Gemfile/vendor/_site auto-excludes, keep_files
# [.git, .svn]) are not repeated here — only deviations from them are set.
# Cleaned 2026-08-05; the git history of this file documents what was dropped.
#
# Theme is fully vendored into this repo (_layouts, _includes, _sass, assets/js)
# from minimal-mistakes 4.24.0 — no remote_theme / theme gem, so builds need no
# network and work offline from a fresh clone. The skin defaults to "default"
# via assets/css/main.scss.

# Site Settings
locale                   : "en"
title                    : "arc42"
name                     : "Dr. Gernot Starke"
description              : "Resources for software architects."
url                      : "https://arc42.org" # the base hostname & protocol for your site
repository               : "arc42/arc42.org-site" # GitHub username/repo-name
teaser                   : /images/arc42-splash-landingpage.jpg # og:image fallback via _includes/seo.html

# The site has no posts and no feed-worthy content of its own; hide the theme's
# feed <link> in <head>. jekyll-feed still serves an (empty) /feed.xml for any
# legacy subscriber. This replaced a stale link to it-and-more.blogspot.com.
atom_feed:
  hide                   : true

# Social Sharing (consumed by _includes/seo.html)
social:
  type                   : Organization # Person or Organization (defaults to Person)
  name                   : arc42 # If the user or organization name differs from the site's name

# Site Author
author:
  name             : "Dr. Gernot Starke"
  avatar           : /images/Gernot-avatar-2016.jpg
  bio              : "INNOQ fellow, (co)founder of arc42, founder of aim42"
  location         : "Cologne, Germany"
  email            : info@arc42.de
  uri              : https://www.gernotstarke.de
  github           : arc42
  twitter          : arc42Tipps

# Reading Files
include:
  - _pages
  - downloads
  - robots.txt

# On top of Jekyll 4's default excludes. Every entry names something that
# exists in the repo; prune this list when the file goes.
exclude:
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - README.*
  - Dockerfile
  - docker-compose.yml
  - docker
  - Makefile
  - netlify.toml
  - LICENSE-theme.txt
  - "*.code-workspace"
  - todo
  - PRODUCT.md
  - DESIGN.md

# Sass/SCSS (style/sourcemap are non-defaults; dir _sass is the default)
sass:
  style: compressed
  sourcemap: never  # Jekyll 4 emits a .css.map by default; not needed for this static site

# Collections
collections:
  resources:
    # Each item is data for the /resources/ listing AND gets its own detail
    # page at /resources/<slug>/. Items with `detail: true` are linked from
    # the listing; the rest are canonical landing pages linked only directly.
    output: true
    permalink: /resources/:name/

# Outputting
permalink: /:categories/:title/

# Plugins (mirrors the Gemfile's :jekyll_plugins group)
plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# HTML Compression - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  # _resources — each item renders through the resource detail layout
  - scope:
      path: ""
      type: resources
    values:
      layout: resource
