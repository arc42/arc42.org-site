<!-- start custom head snippets -->

<!-- No font CDN here on purpose: Libre Caslon Text and Atkinson Hyperlegible
     Next are self-hosted from /assets/fonts/ via _sass/arc42-fonts.scss. -->
<script defer data-domain="arc42.org,rollup.arc42.com" src="https://plausible.io/js/script.js"></script>

<!-- Favicons: the "42" circle in masthead navy — the wordmark was illegible at
     16/32px. Legacy Windows tiles (mstile-*, browserconfig.xml) removed
     2026-07-30; they were referenced nowhere and target IE11/Win 8.1. -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<!-- No mask-icon: Safari ≥12 pins tabs with the standard favicon; the
     monochrome pinned-tab SVG served Safari 9–11 only and is retired. -->

<!-- Mobile browser chrome wears the masthead hue (meta.arc42.org ADR-0008) -->
<meta name="theme-color" content="#2b3a57">

<!-- end custom head snippets -->
